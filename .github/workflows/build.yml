name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "Plex Intake Manager (PIM)/PIM.Web.csproj"

      - name: Build
        run: dotnet build "Plex Intake Manager (PIM)/PIM.Web.csproj" --configuration Release --no-restore
