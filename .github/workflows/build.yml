name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/**
      - feat/**
      - fix/**
      - chore/**
      - integration/**

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore "Plex Integrity Manager (PIM).sln"

      - name: Build solution
        run: dotnet build "Plex Integrity Manager (PIM).sln" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "PIM.Tests/PIM.Tests.csproj" --configuration Release --no-build --verbosity normal
