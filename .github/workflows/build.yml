name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/**
      - integration/**

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore web application
        run: dotnet restore "Plex Intake Manager (PIM)/PIM.Web.csproj"

      - name: Build web application
        run: dotnet build "Plex Intake Manager (PIM)/PIM.Web.csproj" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "PIM.Tests/PIM.Tests.csproj" --configuration Release --verbosity normal
